site_name: Django HTK (Hack Toolkit)
site_description: Production-ready Django toolkit with 29 apps, 47+ integrations, and 24 utility categories
site_author: Jonathan Tsai & HTK Contributors
site_url: https://hacktoolkit.github.io/django-htk/
repo_url: https://github.com/hacktoolkit/htk-django-skeleton
repo_name: htk-django-skeleton
copyright: Copyright &copy; 2024 HTK Contributors. MIT License.

theme:
  name: material
  logo: https://raw.githubusercontent.com/hacktoolkit/htk-django-skeleton/master/static/htk/images/htk-logo.png
  favicon: https://raw.githubusercontent.com/hacktoolkit/htk-django-skeleton/master/static/htk/images/htk-favicon.ico

  palette:
    - scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

